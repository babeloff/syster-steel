[package]
authors = ['Fredrick Eisele <fred.eisele@vanderbilt.edu>']
description = 'SysML v2 scripting via Steel Scheme'
edition = '2024'
license = 'MIT'
name = 'syster-steel'
rust-version = '1.95'
version = "0.1.4"

[[bin]]
name = 'syster-steel'
path = 'src/main.rs'

[dependencies]
anyhow = '1'
dirs = "6"
glob = '0.3'
handlebars = '6'
rustyline = "18"
serde_json = '1'
layout-rs = '0.1.3'
steel-core = '0.8.2'
syster-base = '0.4.0-alpha'
tracing = '0.1'

[dependencies.clap]
features = ['derive']
version = '4'

[dependencies.tracing-subscriber]
features = ['env-filter']
version = '0.3'

[dev-dependencies]
