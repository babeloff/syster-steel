# rattler-build conda recipe — syster-steel
#
# Build with rattler-build:
#   rattler-build build --recipe recipe.yaml
#
# This recipe produces two conda packages:
#   syster-steel          — Steel Scheme REPL and script runner binary
#   syster-steel-plantuml — Steel Scheme scripts for PlantUML diagram generation

schema_version: 1

context:
  version: "0.1.0"

# ── Shared source ──────────────────────────────────────────────────────────────
source:
  - path: .
    use_gitignore: true

# ── Outputs ───────────────────────────────────────────────────────────────────
outputs:

  # ── syster-steel ──────────────────────────────────────────────────────────
  - package:
      name: syster-steel
      version: ${{ version }}

    build:
      number: 0
      script:
        - cargo install --path . --no-track --root $PREFIX

    requirements:
      build:
        - ${{ compiler('rust') }}
        - rust >=1.85

    tests:
      - script:
          - syster-steel --help
          - syster-steel --version
          - echo "(+ 1 2)" | syster-steel -e "(display (+ 1 2))"

    about:
      summary: Steel Scheme REPL and script runner for SysML v2 workflows
      description: |
        syster-steel embeds the Steel Scheme interpreter (steel-core) as a
        command-line tool. It supports an interactive REPL, running script
        files, evaluating inline expressions, and dropping into the REPL
        after running scripts — providing a scriptable layer over the syster
        SysML v2 toolchain.
      license: MIT
      license_file: LICENSE
      repository: https://github.com/jade-codes/syster-steel

  # ── syster-steel-plantuml ─────────────────────────────────────────────────
  - package:
      name: syster-steel-plantuml
      version: ${{ version }}

    build:
      number: 0
      noarch: generic
      script:
        - mkdir -p $PREFIX/share/syster-steel/script
        - cp -r script/. $PREFIX/share/syster-steel/script/

    requirements:
      run:
        - ${{ pin_subpackage('syster-steel', exact=True) }}
        - plantuml

    tests:
      - script:
          - test -d $PREFIX/share/syster-steel/script
          - JAVA_TOOL_OPTIONS=-Djava.awt.headless=true plantuml -version

    about:
      summary: Steel Scheme scripts for generating PlantUML diagrams from SysML v2 views
      description: |
        Steel Scheme scripts (script/plantuml.scm and script/templates/) that
        drive PlantUML diagram generation from SysML v2 models. Scripts accept
        a SysML view description and produce a .puml source file, then invoke
        plantuml to render it as SVG (or other supported formats). Requires
        syster-steel for the interpreter and plantuml for rendering.
      license: MIT
      license_file: LICENSE
      repository: https://github.com/jade-codes/syster-steel
