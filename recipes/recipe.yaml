schema_version: 1
context:
    version: 0.1.3
source:
    - path: ..
      use_gitignore: true
outputs:
    - package:
        name: syster-steel
        version: ${{ version }}
      build:
        number: 0
        script:
            - cargo install --path . --no-track --root $PREFIX
      requirements:
        build:
            - ${{ compiler('rust') }}
            - rust >=1.85
      tests:
        - script:
            - syster-steel --help
            - syster-steel --version
            - echo "(+ 1 2)" | syster-steel -e "(display (+ 1 2))"
      about:
        summary: Steel Scheme REPL and script runner for SysML v2 workflows
        description: |
            syster-steel embeds the Steel Scheme interpreter (steel-core) as a
            command-line tool. It supports an interactive REPL, running script
            files, evaluating inline expressions, and dropping into the REPL
            after running scripts — providing a scriptable layer over the syster
            SysML v2 toolchain.
        license: MIT
        license_file: LICENSE
        repository: https://github.com/jade-codes/syster-steel
    - package:
        name: syster-steel-plantuml
        version: ${{ version }}
      build:
        number: 0
        noarch: generic
        script:
            - mkdir -p $PREFIX/share/syster-steel/steel
            - cp -r steel/. $PREFIX/share/syster-steel/steel/
      requirements:
        run:
            - ${{ pin_subpackage('syster-steel', exact=True) }}
      tests:
        - script:
            - test -d $PREFIX/share/syster-steel/steel
      about:
        summary: Steel Scheme scripts for generating diagrams from SysML v2 views
        description: |
            Steel Scheme scripts (steel/plantuml.scm, steel/dot.scm, steel/templates/) that
            drive diagram generation from SysML v2 models. Scripts produce .puml source
            files via Handlebars templates and .svg files via the built-in layout-rs
            renderer (Sugiyama hierarchical layout, no external process required).
        license: MIT
        license_file: LICENSE
        repository: https://github.com/jade-codes/syster-steel
